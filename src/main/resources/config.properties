# YinwuLastServer 配置（首次启动会自动释放到 plugins/yinwu-lastserver/config.properties）

# 默认大厅：必须与 velocity.toml 的 [servers] 里的键名完全一致
default-server=lobby

# 送回之前对目标子服做一次探活的超时（毫秒）。
# <= 0 表示不做预检，完全依赖"登录阶段被拒绝时回退"这条兜底。
ping-timeout-millis=1500

# 是否把"默认大厅"也记成玩家上次所在的服。
# false（推荐）：玩家在大厅退出，或子服崩了被弹回大厅后再退出，记录仍留在原子服，下次直接回原子服。
# true         ：严格意义上的"上次所在服"，包括大厅。
remember-default-server=false

# 玩家已经站在某个子服上、只是这一次"转服"失败时（典型场景：Van 重启那十几秒里
# 玩家点了 /server van，或点了子服菜单），是否只提示、把人留在原处。
# true（推荐）：显示"无法连接到 van（可能正在重启），你仍留在 lobby"，
#               玩家不会被踢出整个代理，过一会儿再进即可。
# false        ：恢复 Velocity 默认行为 —— 直接把人踢出代理。
stay-on-failed-transfer=true

# 玩家记录文件名（存放在本插件的配置目录内）
data-file=last-server.properties
